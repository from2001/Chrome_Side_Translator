<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Side Translator</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="panel-page">
    <header class="app-header">
      <div class="app-brand">
        <img class="app-brand-icon" src="assets/icons/icon-48.png" alt="" width="42" height="42">
        <div>
          <p class="eyebrow">OPENAI POWERED</p>
          <h1>Side Translator</h1>
        </div>
      </div>
      <button id="open-settings" class="icon-button" type="button" aria-label="設定を開く" title="設定を開く">
        <span aria-hidden="true">⚙</span>
      </button>
    </header>

    <main>
      <section id="key-notice" class="notice" hidden>
        <div>
          <strong>APIキーを設定してください</strong>
          <p>翻訳・要約にはOpenAI APIキーが必要です。</p>
        </div>
        <button id="notice-settings" class="text-button" type="button">設定</button>
      </section>

      <section id="progress-card" class="progress-card" aria-live="polite" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <div>
          <strong id="progress-title">本文を抽出しています</strong>
          <p id="progress-detail">ページのメインコンテンツを解析中です。</p>
        </div>
      </section>

      <section id="error-card" class="error-card" role="alert" hidden>
        <strong>処理できませんでした</strong>
        <p id="error-message"></p>
      </section>

      <section id="result-card" class="result-card" aria-labelledby="result-title" hidden>
        <div class="result-header">
          <div>
            <p id="result-mode" class="section-kicker">TRANSLATION</p>
            <h2 id="result-title">翻訳結果</h2>
          </div>
          <details class="copy-menu">
            <summary>コピー</summary>
            <div class="copy-options" aria-label="コピー形式">
              <button type="button" data-copy-format="text">テキストとしてコピー</button>
              <button type="button" data-copy-format="markdown">Markdownとしてコピー</button>
            </div>
          </details>
        </div>
        <div id="source-meta" class="source-meta"></div>
        <div id="result-output" class="result-output" tabindex="0"></div>
        <div class="result-footer">
          <details class="copy-menu">
            <summary>コピー</summary>
            <div class="copy-options" aria-label="コピー形式">
              <button type="button" data-copy-format="text">テキストとしてコピー</button>
              <button type="button" data-copy-format="markdown">Markdownとしてコピー</button>
            </div>
          </details>
        </div>
      </section>
    </main>

    <div class="action-dock" role="region" aria-label="ページの処理操作">
      <div id="source-indicator" class="source-indicator" aria-live="polite">
        <strong id="source-indicator-label">ページ本文を処理します</strong>
      </div>

      <div id="page-actions" class="action-grid">
        <button id="translate-button" class="primary-button" type="button" data-mode="translate">
          <span class="button-icon" aria-hidden="true">翻</span>
          <span>
            <strong>日本語に翻訳</strong>
          </span>
        </button>
        <button id="summarize-button" class="secondary-button" type="button" data-mode="summarize">
          <span class="button-icon" aria-hidden="true">要</span>
          <span>
            <strong>日本語で要約</strong>
          </span>
        </button>
      </div>

      <div id="gmail-actions" class="action-grid" hidden>
        <button id="gmail-thread-summary-button" class="primary-button" type="button">
          <span class="button-icon" aria-hidden="true">全</span>
          <span>
            <strong>メールスレッド全体を要約</strong>
          </span>
        </button>
        <button id="gmail-latest-summary-button" class="secondary-button" type="button">
          <span class="button-icon" aria-hidden="true">新</span>
          <span>
            <strong>最新のメールを要約</strong>
          </span>
        </button>
        <button id="gmail-latest-translate-button" class="secondary-button" type="button">
          <span class="button-icon" aria-hidden="true">翻</span>
          <span>
            <strong>最新のメールを翻訳</strong>
          </span>
        </button>
      </div>

      <footer class="app-footer">
        <span>Model: <code>gpt-5.4-nano</code></span>
        <button id="footer-settings" class="link-button" type="button">API設定</button>
      </footer>
    </div>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
